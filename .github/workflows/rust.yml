name: Rust build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-x11-0 libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev xdotool
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Resolve dependencies
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Preserve resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-lockfile
          path: Cargo.lock
      - name: Format source for build diagnostics
        run: |
          mkdir -p dist
          cargo fmt --all
          git diff --binary > dist/source-format.patch
      - name: Engine regression tests
        run: cargo test --locked --workspace
      - name: Check workspace
        run: cargo check --locked --workspace
      - name: Build CLI and desktop
        run: cargo build --locked --release --workspace
      - name: Prepare test and desktop tools
        run: sudo apt-get install -y podman xvfb imagemagick
      - name: Prepare output directory
        run: |
          mkdir -p dist
          cp target/release/rust-repair target/release/rust-repair-desktop dist/
          chmod +x dist/rust-repair dist/rust-repair-desktop
      - name: Verify sandbox and fail-before/pass-after fixture
        env:
          GPUFOLD_HOST_SECRET: CI_HOST_SENTINEL_NOT_FOR_SANDBOX
        run: |
          bash scripts/build-sandbox.sh --approve-image-download
          dist/rust-repair sandbox-probe > dist/sandbox-probe.txt
          bash scripts/verify-fixture.sh
      - name: Verify public repository pinning and preflight
        run: dist/rust-repair new https://github.com/PenguinMan05/gpu-fold --task "Inspect repository preflight without inference or publishing" > dist/public-preflight.txt
      - name: Launch native desktop and capture it
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run --auto-servernum bash scripts/verify-desktop.sh
      - name: Package Linux app
        run: bash scripts/package-deb.sh
      - name: Install and verify package
        run: |
          sudo dpkg -i dist/GPUFold_*_amd64-*.deb
          /usr/bin/gpufold-cli --version
          test -L /usr/bin/gpufold
          /usr/bin/rust-repair --version
          test -f /usr/share/applications/rust-repair.desktop
          test -f /usr/share/rust-repair/scripts/sandbox-runner.rs
          test -f /usr/share/rust-repair/scripts/Containerfile
      - name: Upload binaries and resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/
            Cargo.lock
      - name: Preserve verification logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-verification
          path: dist/

  release:
    name: Publish verified Debian release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release-assets
      - name: Verify package and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          tag="v${version}"
          (cd release-assets/dist && sha256sum -c ./*.deb.sha256)
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is being verified; this older build will not be released."
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; existing assets are preserved."
          else
            gh release create "$tag" release-assets/dist/GPUFold_*.deb release-assets/dist/GPUFold_*.deb.sha256 \
              --target "$GITHUB_SHA" --title "GPUFold ${version} — guided setup" \
              --notes-file docs/RELEASE_NOTES.md --prerelease
          fi
