name: Rust build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Engine regression tests
        run: cargo test --locked -p repair-core
      - name: Check workspace
        run: cargo check --locked --workspace
      - name: Build CLI and desktop
        run: cargo build --locked --release --workspace
      - name: Upload binaries and resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            target/release/rust-repair
            target/release/rust-repair-desktop
            Cargo.lock
