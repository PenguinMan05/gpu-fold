[workspace]
members = ["crates/repair-core", "crates/repair-cli", "crates/repair-desktop"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "=1.0.93"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.8"
hex = "=0.4.3"
fs2 = "=0.4.3"
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.0"
tokenizers = { version = "=0.21.4", default-features = false, features = ["onig"] }
regex = "=1.11.1"
jsonschema = { version = "=0.18.3", default-features = false }
base64 = "=0.22.1"
reqwest = { version = "=0.12.9", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
ctrlc = { version = "=3.4.5", features = ["termination"] }
clap = { version = "=4.5.20", features = ["derive"] }
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
walkdir = "=2.5.0"
tar = "=0.4.43"
flate2 = "=1.0.35"
toml = "=0.8.23"
keyring = { version = "=3.6.2", features = ["sync-secret-service", "crypto-rust"] }
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "process", "time", "macros"] }
rmcp = { version = "=0.8.5", features = ["client", "transport-child-process"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
